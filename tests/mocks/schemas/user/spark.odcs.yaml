properties:

  - name: name
    logicalType: string
    physicalType: string

  - name: profile
    logicalType: object
    physicalType: '{"type": "struct", "fields": [{"name": "age", "type": "integer", "nullable": true, "metadata": {}}]}'
    properties:
      - name: age
        logicalType: integer
        physicalType: integer
        logicalTypeOptions:
          format: i32

  - name: friends
    logicalType: array
    physicalType: '{"type": "array", "elementType": {"type": "struct", "fields": [{"name": "name", "type": "string", "nullable": true, "metadata": {}}]}, "containsNull": true}'
    items:
      logicalType: object
      physicalType: '{"type": "struct", "fields": [{"name": "name", "type": "string", "nullable": true, "metadata": {}}]}'
      properties:
        - name: name
          logicalType: string
          physicalType: string
