name: "Setup environment"
description: "Setup Python from pyproject.toml, setup uv, and restore caches. Requires the repository to be checked out first."

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6

    - name: Set up UV
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
