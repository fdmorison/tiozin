name: PR Code

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tiozin/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  code:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install Dependencies
        run: make install

      - name: Lint
        run: make check

      - name: Tests
        run: make test
