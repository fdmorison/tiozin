[project]
name = "tiozin"
version = "4.1.2"
description = "Tiozin, your friendly ETL framework"
readme = "README.md"
requires-python = ">=3.11"

license = "MPL-2.0"
authors = [
  { name = "Fabricio D'Morison", email = "fabricio.dmorison@gmail.com" }
]

keywords = ["etl", "data", "pipeline", "framework", "declarative", "yaml"]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
]

dependencies = [
  # Structural — framework won't work without these
  "pydantic ~=2.12",
  "pydantic-settings ~=2.14.2",
  "environs ~=14.3",
  "single-source ~=0.4",
  "structlog ~=25.5",
  "jinja2 ~=3.1.6",
  "ruamel-yaml ~=0.18",
  "pendulum ~=3.1.0",
  "wrapt ~=2.0.1",
  "fsspec[s3,gcs,adl,sftp] ~=2026.6.0",
  "openlineage-python ~=1.45.0",
  # Utilities — small helpers with focused roles
  "typer ~=0.20",
  "uuid-utils ~=0.12",
  "python-slugify ~=8.0.4",
  "inflection ~=0.5.1",
  "python-rapidjson ~=1.23",
  "python-benedict ~=0.38.0",
  "openlineage-sql ~=1.45.0",
  # Temporary — to be removed once schema converters are rewritten
  "datacontract-cli>=0.11.9,<1.3.0",
  "databricks-sdk ~=0.102.0",
]

[project.optional-dependencies]
tio_kernel = [
  "pyiceberg[pyarrow,sql-sqlite] >=0.7.0,<1.0.0",
  "boto3 ~=1.38",
  "google-cloud-secret-manager ~=2.23",
]
tio_spark = [
  "tio_spark",
]
tio_spark35 = [
  "tio_spark[pyspark35]",
]
tio_spark40 = [
  "tio_spark[pyspark40]",
]
tio_duckdb = [
  "tio_duckdb",
]
aws = [
  "boto3 ~=1.38",
]
gcp = [
  "google-cloud-secret-manager ~=2.23",
]

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
]
test = [
  "pytest ==9.0.3",
  "pytest-cov ==7.0.0",
  "freezegun ==1.5.5",
  "assertpy ==1.1",
  "pyarrow ==23.0.1",
  "tiozin[tio_kernel]",
]
lint = [
  "ruff ==0.14.10",
  "pre-commit ==4.3.0",
  "pyarrow-stubs>=20.0.0.20260625",
]

[project.scripts]
tiozin = "tiozin.cli:main"

[project.entry-points."tiozin.family"]
tio_kernel = "tiozin.family.tio_kernel"

[project.urls]
Homepage = "https://github.com/fdmorison/tiozin"
Repository = "https://github.com/fdmorison/tiozin"
Issues = "https://github.com/fdmorison/tiozin/issues"

[tool.uv]
required-version = ">=0.8.1"
conflicts = [
  [
    { extra = "tio_spark35" },
    { extra = "tio_spark40" },
  ],
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --cov --cov-report term"

[tool.coverage.run]
source = ["tiozin"]
omit = [
  "tiozin/env.py",
  "tiozin/config.py",
  "tiozin/logs.py",
  "tiozin/**/__init__.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B904", "B021", "B017"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.isort]
known-first-party = ["tiozin"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = [
  "tiozin",
  "README.md",
  "pyproject.toml"
]
